name: Docker

on:
  workflow_call:
    inputs:
      tag:
        description: Existing semantic-release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-release tag to republish (for example v1.0.0-alpha.1)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      labels: ${{ steps.image.outputs.labels }}
      tags: ${{ steps.image.outputs.tags }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha\.[1-9][0-9]*)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          remainder="${version#*.}"
          minor="${remainder%%.*}"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repository}"
          revision="$(git rev-parse HEAD)"
          created="$(git show --no-patch --format='%cI' HEAD)"
          {
            echo "name=${image}"
            echo 'tags<<EOF'
            echo "${image}:${version}"
            if [[ "${version}" == *-alpha.* ]]; then
              echo "${image}:alpha"
            else
              echo "${image}:${major}.${minor}"
              echo "${image}:${major}"
              echo "${image}:latest"
            fi
            echo 'EOF'
            echo 'labels<<EOF'
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${revision}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.created=${created}"
            echo 'org.opencontainers.image.description=Single-tenant payment gateway for Cloudflare Workers and Bun'
            echo 'org.opencontainers.image.licenses=GPL-3.0-or-later'
            echo 'EOF'
          } >>"${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release-candidate container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: gmpay-edge:release-candidate
          cache-from: type=gha,scope=gmpay-edge-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gmpay-edge-${{ matrix.arch }}

      - name: Smoke-test release-candidate container
        shell: bash
        run: |
          docker run --detach --name gmpay-edge-release \
            --publish 127.0.0.1:3000:3000 \
            --volume gmpay-edge-release-data:/var/lib/gmpay \
            --env GMPAY_DATA_DIR=/var/lib/gmpay \
            gmpay-edge:release-candidate

          healthy=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "${healthy}" != true ]]; then
            docker logs gmpay-edge-release
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error \
            --header 'Host: pay.example' \
            --header 'X-Forwarded-Proto: https' \
            --dump-header /tmp/gmpay-edge-headers \
            --output /dev/null \
            http://127.0.0.1:3000/install
          grep --ignore-case '^strict-transport-security:' /tmp/gmpay-edge-headers
          docker exec gmpay-edge-release bun run data -- --help

      - name: Stop release-candidate container
        if: always()
        run: |
          docker rm --force gmpay-edge-release >/dev/null 2>&1 || true
          docker volume rm gmpay-edge-release-data >/dev/null 2>&1 || true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=gmpay-edge-${{ matrix.arch }}

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid platform digest: ${IMAGE_DIGEST}" >&2
            exit 1
          fi
          digest="${IMAGE_DIGEST#sha256:}"
          mkdir --parents "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-platform manifest
        id: manifest
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image }}
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          mapfile -t digests < <(
            find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -exec basename {} \; |
              sort
          )
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digests[@]}." >&2
            exit 1
          fi

          tag_arguments=()
          first_tag=""
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              tag_arguments+=(--tag "${tag}")
              if [[ -z "${first_tag}" ]]; then
                first_tag="${tag}"
              fi
            fi
          done <<<"${IMAGE_TAGS}"

          sources=()
          for digest in "${digests[@]}"; do
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid platform digest artifact: ${digest}" >&2
              exit 1
            fi
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_arguments[@]}" "${sources[@]}"
          manifest_digest="$(
            docker buildx imagetools inspect --raw "${first_tag}" |
              sha256sum |
              awk '{ print "sha256:" $1 }'
          )"
          echo "digest=${manifest_digest}" >>"${GITHUB_OUTPUT}"

      - name: Attest published image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: false

      - name: Remove superseded alpha artifacts
        if: ${{ !contains(inputs.tag, '-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          package_name="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          if gh api "/orgs/${owner}" >/dev/null 2>&1; then
            package_versions_endpoint="/orgs/${owner}/packages/container/${package_name}/versions"
          else
            package_versions_endpoint="/users/${owner}/packages/container/${package_name}/versions"
          fi

          image_alpha_prefix="${RELEASE_TAG#v}-alpha."
          gh api --paginate "${package_versions_endpoint}?per_page=100" |
          jq -r --arg prefix "${image_alpha_prefix}" '
            .[] |
            select(any(.metadata.container.tags[]?;
              startswith($prefix) and (ltrimstr($prefix) | test("^[1-9][0-9]*$")))) |
            .id
          ' |
          while read -r package_version_id; do
            gh api --method DELETE "${package_versions_endpoint}/${package_version_id}"
          done

          release_alpha_prefix="${RELEASE_TAG}-alpha."
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 \
            --json isPrerelease,tagName \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r prerelease_tag; do
            suffix="${prerelease_tag#"${release_alpha_prefix}"}"
            if [[ "${prerelease_tag}" == "${release_alpha_prefix}"* && "${suffix}" =~ ^[1-9][0-9]*$ ]]; then
              gh release delete "${prerelease_tag}" --repo "${GITHUB_REPOSITORY}" \
                --cleanup-tag --yes
            fi
          done
