name: Docker

on:
  workflow_call:
    inputs:
      tag:
        description: Existing semantic-release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-release tag to republish (for example v1.0.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      labels: ${{ steps.image.outputs.labels }}
      tags: ${{ steps.image.outputs.tags }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          remainder="${version#*.}"
          minor="${remainder%%.*}"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repository}"
          revision="$(git rev-parse HEAD)"
          created="$(git show --no-patch --format='%cI' HEAD)"
          {
            echo "name=${image}"
            echo 'tags<<EOF'
            echo "${image}:${version}"
            echo "${image}:${major}.${minor}"
            echo "${image}:${major}"
            echo "${image}:latest"
            echo 'EOF'
            echo 'labels<<EOF'
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${revision}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.created=${created}"
            echo 'org.opencontainers.image.description=Single-tenant payment gateway for Cloudflare Workers and Bun'
            echo 'org.opencontainers.image.licenses=GPL-3.0-or-later'
            echo 'EOF'
          } >>"${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build release-candidate container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: gmpay-edge:release-candidate
          cache-from: type=gha,scope=gmpay-edge-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gmpay-edge-${{ matrix.arch }}

      - name: Smoke-test release-candidate container
        shell: bash
        run: |
          docker run --detach --name gmpay-edge-release \
            --publish 127.0.0.1:3000:3000 \
            --volume gmpay-edge-release-data:/var/lib/gmpay \
            --env GMPAY_DATA_DIR=/var/lib/gmpay \
            gmpay-edge:release-candidate

          healthy=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "${healthy}" != true ]]; then
            docker logs gmpay-edge-release
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error \
            --header 'Host: pay.example' \
            --header 'X-Forwarded-Proto: https' \
            --dump-header /tmp/gmpay-edge-headers \
            --output /dev/null \
            http://127.0.0.1:3000/install
          grep --ignore-case '^strict-transport-security:' /tmp/gmpay-edge-headers
          docker exec gmpay-edge-release bun run data -- --help

      - name: Stop release-candidate container
        if: always()
        run: |
          docker rm --force gmpay-edge-release >/dev/null 2>&1 || true
          docker volume rm gmpay-edge-release-data >/dev/null 2>&1 || true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push platform image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=gmpay-edge-${{ matrix.arch }}

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid platform digest: ${IMAGE_DIGEST}" >&2
            exit 1
          fi
          digest="${IMAGE_DIGEST#sha256:}"
          mkdir --parents "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-platform manifest
        id: manifest
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image }}
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          mapfile -t digests < <(
            find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -exec basename {} \; |
              sort
          )
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digests[@]}." >&2
            exit 1
          fi

          tag_arguments=()
          first_tag=""
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              tag_arguments+=(--tag "${tag}")
              if [[ -z "${first_tag}" ]]; then
                first_tag="${tag}"
              fi
            fi
          done <<<"${IMAGE_TAGS}"

          sources=()
          for digest in "${digests[@]}"; do
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid platform digest artifact: ${digest}" >&2
              exit 1
            fi
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_arguments[@]}" "${sources[@]}"
          manifest_digest="$(
            docker buildx imagetools inspect --raw "${first_tag}" |
              sha256sum |
              awk '{ print "sha256:" $1 }'
          )"
          echo "digest=${manifest_digest}" >>"${GITHUB_OUTPUT}"

      - name: Attest published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: false
