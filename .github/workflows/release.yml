name: Release

on:
  push:
    branches:
      - main
    # Workflow and automation-only changes are validated by ci.yml; they never
    # produce a release, so the release gate does not re-run for them.
    paths-ignore:
      - '.github/**'
      - 'scripts/project-automation-*.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.release-tag.outputs.value }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Restore Bun and build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate
        run: |
          bun run typecheck
          bun run test
          bun run check
          bun run build
          bun run build:bun

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: bun run release

      - name: Resolve released tag
        id: release-tag
        shell: bash
        run: |
          git fetch --force origin "${GITHUB_REF_NAME}" --tags
          release_tag="$(git tag --points-at "${GITHUB_SHA}" --list 'v*' | sort -V | tail -n 1)"
          if [[ -z "${release_tag}" ]]; then
            for candidate in $(git rev-list --reverse --first-parent "${GITHUB_SHA}..origin/${GITHUB_REF_NAME}"); do
              release_tag="$(git tag --points-at "${candidate}" --list 'v*' | sort -V | tail -n 1)"
              if [[ -n "${release_tag}" ]]; then
                break
              fi
            done
          fi
          echo "value=${release_tag}" >>"${GITHUB_OUTPUT}"

  docker:
    name: Publish Docker image
    needs: release
    if: needs.release.outputs.release-tag != ''
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release.outputs.release-tag }}
